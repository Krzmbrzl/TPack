name: Build and Test

on:
  push:
    branches: [main]
  pull_request:


jobs:
  run:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025, macos-26]
        build_type: [Debug, Release]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - if: startswith(matrix.os, 'windows')
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Configure
        shell: bash
        run: cmake -G Ninja -B build -S . -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        shell: bash
        run: cmake --build build

      - name: Test
        shell: bash
        run: cd build && ctest -R '^TPack' --output-on-failure

      - name: Exercise benchmarks
        shell: bash
        # Run every benchmark once (--benchmark_dry_run) so they keep compiling and executing without
        # spending CI time on actual measurements.
        run: ./build/benchmarks/tensor_packing_benchmarks --benchmark_dry_run

      - name: Install
        shell: bash
        run: cmake --install build --prefix ~/tpack

      - name: Consume Installed
        shell: bash
        run: cd example && mkdir build && cd build && cmake -DCMAKE_PREFIX_PATH=~/tpack .. && cmake --build .
